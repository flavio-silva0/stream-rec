version: '3.8'

services:
  # =======================================================
  # 1. Banco de Grafos Neo4j
  # =======================================================
  neo4j:
    image: neo4j:5.20-community
    container_name: streamrec-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Interface Web (Neo4j Browser)
      - "7687:7687"   # Protocolo Bolt (Conexão da API)
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =======================================================
  # 2. Cache In-Memory Redis
  # =======================================================
  redis:
    image: redis:7-alpine
    container_name: streamrec-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =======================================================
  # 3. API FastAPI (Plataforma de Recomendação)
  # =======================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamrec-api
    restart: unless-stopped
    ports:
      - "8000:8000"   # Documentação Swagger em http://localhost:8000/docs
    environment:
      - PROJECT_NAME=StreamRec - Plataforma de Recomendação
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_TTL=60
      - USE_MOCK_FALLBACK=false
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
